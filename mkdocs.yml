site_name: Vikunja for Mere Mortals
site_description: A self-hosted to-do and project manager that runs as one small program. Organising work into projects and tasks, viewing them as lists, tables, Gantt charts and kanban boards, sharing them with a team or a public link, and syncing deadlines to a calendar, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/vikunja-for-mere-mortals/
